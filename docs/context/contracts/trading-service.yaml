openapi: 3.0.3
info:
  title: trading-service
  description: Market Orders (buy/sell), portfolio, order history, transactions, commissions.
  version: 1.0.0
servers:
  - url: http://localhost:8082/api/v1
tags:
  - name: orders
  - name: portfolio
  - name: transactions
paths:
  /orders/buy:
    post:
      tags:
        - orders
      summary: Place a market buy order
      description: |
        Validates balance (local), validates market is open, sends to Alpaca, waits for fill confirmation,
        updates local balance, sends async notification and audit events.
        If `queue: true` and market is closed, stores order as PENDING_QUEUE and returns 202 instead of 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '202':
          description: Order queued for next market open (only when queue=true and market is closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedOrderResponse'
        '400':
          description: Insufficient funds or insufficient holdings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientFunds:
                  value:
                    error: "Fondos insuficientes"
        '422':
          description: Market is closed and queue=false (or omitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "El mercado está cerrado"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/sell:
    post:
      tags:
        - orders
      summary: Place a market sell order
      description: |
        Validates that the user holds enough shares of the symbol. Sends to Alpaca, waits for fill, updates local balance.
        If `queue: true` and market is closed, stores order as PENDING_QUEUE and returns 202 instead of 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '202':
          description: Order queued for next market open (only when queue=true and market is closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedOrderResponse'
        '400':
          description: Insufficient holdings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Cantidad insuficiente de acciones"
        '422':
          description: Market is closed and queue=false (or omitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "El mercado está cerrado"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{orderId}:
    delete:
      tags:
        - orders
      summary: Cancel a queued order (PENDING_QUEUE only)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Order cancelled successfully
        '404':
          description: Order not found or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Orden no encontrada"
        '409':
          description: Order cannot be cancelled (status is not PENDING_QUEUE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Solo se pueden cancelar órdenes en estado PENDING_QUEUE"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders:
    get:
      tags:
        - orders
      summary: Get order history (paginated) - includes all order states (for lifecycle tracking)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: symbol
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - PENDING_QUEUE
              - SENT
              - EXECUTED
              - REJECTED
              - FAILED
              - CANCELLED
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated order history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /portfolio:
    get:
      tags:
        - portfolio
      summary: Get portfolio with current prices (current holdings, balance, P&L)
      description: Returns balance, holdings, and current prices. If markets-service is unavailable, returns pricesAvailable=false and null price fields — does not return an error.
      responses:
        '200':
          description: Portfolio data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /transactions:
    get:
      tags:
        - transactions
      summary: Get executed financial transactions (only EXECUTED orders)
      description: |
        Returns only orders that have been fully executed (status = EXECUTED).
        Each transaction includes the commission (2% of subtotal) and the total amount with sign.
        No broker sharing in MVP.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [BUY, SELL]
          description: Filter by transaction type (buy or sell)
        - name: symbol
          in: query
          schema:
            type: string
          description: Filter by symbol (e.g., AAPL)
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Start date (inclusive, ISO 8601)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: End date (inclusive, ISO 8601)
      responses:
        '200':
          description: Paginated list of executed transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Tu sesión ha expirado. Por favor, inicia sesión nuevamente."
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    PlaceOrderRequest:
      type: object
      required:
        - symbol
        - quantity
        - orderType
      properties:
        symbol:
          type: string
          example: AAPL
        quantity:
          type: integer
          minimum: 1
        orderType:
          type: string
          enum:
            - MARKET
        queue:
          type: boolean
          default: false
          description: If true and market is closed, the order is queued for next market open instead of being rejected.
    QueuedOrderResponse:
      type: object
      properties:
        orderId:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum:
            - buy
            - sell
        quantity:
          type: integer
        estimatedPrice:
          type: number
          format: double
        status:
          type: string
          enum:
            - PENDING_QUEUE
        queuedAt:
          type: string
          format: date-time
        message:
          type: string
          example: "Tu orden quedó encolada y se ejecutará cuando el mercado abra."
    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum:
            - buy
            - sell
        orderType:
          type: string
          enum:
            - MARKET
        quantity:
          type: integer
        estimatedPrice:
          type: number
          format: double
        executedPrice:
          type: number
          format: double
        commission:
          type: number
          format: double
          description: 2% of (executedPrice * quantity)
        totalAmount:
          type: number
          format: double
          description: executedPrice * quantity (without commission)
        newBalance:
          type: number
          format: double
        status:
          type: string
          enum:
            - EXECUTED
            - FAILED
            - REJECTED
        executedAt:
          type: string
          format: date-time
    OrderHistoryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderHistoryItem'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer
    OrderHistoryItem:
      type: object
      properties:
        orderId:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum:
            - buy
            - sell
        orderType:
          type: string
        quantity:
          type: integer
        executedPrice:
          type: number
          format: double
          nullable: true
        commission:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum:
            - PENDING_QUEUE
            - SENT
            - EXECUTED
            - REJECTED
            - FAILED
            - CANCELLED
        createdAt:
          type: string
          format: date-time
        executedAt:
          type: string
          format: date-time
          nullable: true
    PortfolioResponse:
      type: object
      properties:
        balance:
          type: number
          format: double
        pricesAvailable:
          type: boolean
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/HoldingItem'
    HoldingItem:
      type: object
      properties:
        symbol:
          type: string
        quantity:
          type: integer
        avgCost:
          type: number
          format: double
        currentPrice:
          type: number
          format: double
          nullable: true
        totalValue:
          type: number
          format: double
          nullable: true
        gainPct:
          type: number
          format: double
          nullable: true
        gainDollars:
          type: number
          format: double
          nullable: true
    TransactionHistoryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItem'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer
        totalCommission:
          type: number
          format: double
          description: Sum of commissions for all transactions in the result set (useful for summary)
    TransactionItem:
      type: object
      properties:
        transactionId:
          type: string
          description: Unique identifier (orderId)
        date:
          type: string
          format: date-time
        type:
          type: string
          enum: [BUY, SELL]
        symbol:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
          description: Executed price per share
        subtotal:
          type: number
          format: double
          description: unitPrice * quantity (before commission)
        commission:
          type: number
          format: double
          description: 2% of subtotal
        total:
          type: number
          format: double
          description: For BUY: -(subtotal + commission); for SELL: +(subtotal - commission)