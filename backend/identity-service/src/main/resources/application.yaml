spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: identity-service
  cache:
    type: caffeine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/acciones_elbosque}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: identity
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:test@test.com}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-dev-must-be-min-32-chars}
  expiration: ${JWT_EXPIRATION:3600000}

alpaca:
  broker:
    base-url: ${ALPACA_BROKER_BASE_URL:https://broker-api.sandbox.alpaca.markets}
    auth-url: ${ALPACA_BROKER_AUTH_URL:https://authx.sandbox.alpaca.markets}
    api-key: ${ALPACA_BROKER_API_KEY:test-key}
    secret-key: ${ALPACA_BROKER_SECRET_KEY:test-secret}
    firm-account-id: ${ALPACA_FIRM_ACCOUNT_ID:test-firm-id}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  price-id:
    monthly: ${STRIPE_PREMIUM_MONTHLY_PRICE_ID:price_monthly_placeholder}
    annual: ${STRIPE_PREMIUM_ANNUAL_PRICE_ID:price_annual_placeholder}
  checkout:
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/payment/success?session_id={CHECKOUT_SESSION_ID}}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/register?payment=cancelled}

app:
  mail:
    from: ${MAIL_FROM:noreply@acciones-elbosque.com}
  audit:
    url: ${AUDIT_SERVICE_URL:http://localhost:8085}
