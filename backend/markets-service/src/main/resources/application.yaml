spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: markets-service
  cache:
    type: caffeine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/acciones_elbosque}
    username: ${POSTGRES_USER:aeb_user}
    password: ${POSTGRES_PASSWORD:aeb_trading_muy_seguro}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: markets
    show-sql: false

server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-dev-must-be-min-32-chars}

alpaca:
  market-data:
    base-url: ${ALPACA_MARKET_DATA_BASE_URL:https://data.alpaca.markets/v2}
    api-key: ${ALPACA_MARKET_DATA_API_KEY:test-key}
    secret-key: ${ALPACA_MARKET_DATA_SECRET_KEY:test-secret}

cache:
  ttl-seconds: ${CACHE_TTL_SECONDS:2}
