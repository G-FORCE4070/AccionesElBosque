spring:
  application:
    name: trading-service
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: trading
    show-sql: false
server:
  port: 0

jwt:
  secret: default-secret-key-for-dev-must-be-min-32-chars

alpaca:
  broker:
    base-url: https://broker-api.sandbox.alpaca.markets
    api-key: test-key
    secret-key: test-secret
    auth-url: https://authx.sandbox.alpaca.markets
  market-data:
    api-key: test-key
    secret-key: test-secret

scheduling:
  enabled: false

services:
  markets-url: http://localhost:9999
  notification-url: http://localhost:9998
  audit-url: http://localhost:9997

commission:
  percentage: 0.02
